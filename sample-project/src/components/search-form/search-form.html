<section
  class="slds-card app-search-form"
  data-component="search-form"
  aria-labelledby="search-form-title"
>
  <div class="slds-card__header slds-grid">
    <header class="slds-media slds-media_center slds-has-flexi-truncate">
      <div class="slds-media__body">
        <h2 id="search-form-title" class="slds-card__header-title">検索結果</h2>
      </div>
    </header>
  </div>

  <div class="slds-card__body slds-card__body_inner">
    <form data-role="form">
      <div class="slds-grid slds-wrap slds-gutters">
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
          <div class="slds-form-element">
            <label class="slds-form-element__label" for="search-user-name"
              >氏名</label
            >
            <div class="slds-form-element__control">
              <input
                id="search-user-name"
                class="slds-input"
                type="text"
                data-field="name"
                autocomplete="off"
              />
            </div>
          </div>
        </div>

        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
          <div class="slds-form-element">
            <label class="slds-form-element__label" for="search-user-status"
              >ステータス</label
            >
            <div class="slds-form-element__control">
              <div class="slds-select_container">
                <select
                  id="search-user-status"
                  class="slds-select"
                  data-field="status"
                >
                  <option value="">すべて</option>
                  <option value="active">有効</option>
                  <option value="inactive">無効</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="slds-m-top_medium app-search-form__actions">
        <button
          class="slds-button slds-button_brand"
          type="submit"
          data-action="search"
        >
          検索
        </button>
        <button
          class="slds-button slds-button_neutral"
          type="reset"
          data-action="reset"
        >
          クリア
        </button>
      </div>

      <p
        class="slds-m-top_small slds-text-body_small"
        data-role="status"
        aria-live="polite"
      ></p>
    </form>
  </div>
</section>
