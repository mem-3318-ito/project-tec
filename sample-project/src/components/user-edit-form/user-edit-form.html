<section
  class="slds-card app-user-edit-form"
  data-component="user-edit-form"
  aria-labelledby="user-edit-form-title"
>
  <div class="slds-card__header slds-grid">
    <header class="slds-media slds-media_center slds-has-flexi-truncate">
      <div class="slds-media__body">
        <h2 id="user-edit-form-title" class="slds-card__header-title">
          ユーザー編集
        </h2>
      </div>
    </header>
  </div>

  <div class="slds-card__body slds-card__body_inner">
    <form data-role="form">
      <div class="slds-form-element slds-m-bottom_medium">
        <label class="slds-form-element__label" for="edit-user-name">
          <abbr class="slds-required" title="必須">*</abbr>氏名
        </label>
        <div class="slds-form-element__control">
          <input
            id="edit-user-name"
            class="slds-input"
            type="text"
            value="山田 太郎"
            required
            data-field="name"
          />
        </div>
      </div>

      <div class="slds-form-element slds-m-bottom_medium">
        <label class="slds-form-element__label" for="edit-user-email">
          <abbr class="slds-required" title="必須">*</abbr>メールアドレス
        </label>
        <div class="slds-form-element__control">
          <input
            id="edit-user-email"
            class="slds-input"
            type="email"
            value="taro.yamada@example.com"
            required
            data-field="email"
          />
        </div>
      </div>

      <div class="slds-form-element">
        <label class="slds-form-element__label" for="edit-user-status"
          >ステータス
        </label>
        <div class="slds-form-element__control">
          <div class="slds-select_container">
            <select
              id="edit-user-status"
              class="slds-select"
              data-field="status"
            >
              <option value="active" selected>有効</option>
              <option value="inactive">無効</option>
            </select>
          </div>
        </div>
      </div>

      <div class="slds-m-top_large app-user-edit-form__actions">
        <button class="slds-button slds-button_brand" type="submit">
          保存
        </button>
        <a class="slds-button slds-button_neutral" href="./user-list.html">
          キャンセル
        </a>
      </div>

      <p
        class="slds-m-top_small slds-text-body_small"
        data-role="status"
        aria-live="polite"
      ></p>
    </form>
  </div>
</section>
