<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ユーザー編集 | サンプル SLDS UI</title>
    <link rel="stylesheet" href="./vendor/slds/salesforce-lightning-design-system.min.css">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/layout.css">
    <link rel="stylesheet" href="./components/header/header.css">
    <link rel="stylesheet" href="./components/user-edit-form/user-edit-form.css">
    <link rel="stylesheet" href="./components/footer/footer.css">
  </head>
  <body>
    <header class="slds-grid slds-grid_align-spread slds-p-around_medium app-header">
    <div class="slds-grid slds-grid_vertical-align-center slds-gutters_small">
        <div class="slds-col">
            <strong class="app-header__brand">サンプル SLDS UI</strong>
        </div>
    </div>

    <nav aria-label="メインナビゲーション">
        <ul class="slds-list_horizontal slds-has-dividers_right-space">
            <li class="slds-item"><a href="./user-list.html">ユーザー一覧</a></li>
            <li class="slds-item"><a href="./user-edit.html">新規登録</a></li>
        </ul>
    </nav>
</header>

    <main class="app-main">
      <div class="app-visually-constrained app-page-stack">
        <nav aria-label="パンくず">
          <ol class="slds-breadcrumb slds-list_horizontal slds-wrap">
            <li class="slds-breadcrumb__item">
              <a href="./user-list.html">ユーザー一覧</a>
            </li>
            <li class="slds-breadcrumb__item" aria-current="page">
              <span>ユーザー編集</span>
            </li>
          </ol>
        </nav>

        <h1 class="slds-text-heading_large app-page-heading">ユーザー編集</h1>
        <section class="slds-card app-user-edit-form" data-component="user-edit-form" aria-labelledby="user-edit-form-title">
  <div class="slds-card__header slds-grid">
    <header class="slds-media slds-media_center slds-has-flexi-truncate">
      <div class="slds-media__body">
        <h2 id="user-edit-form-title" class="slds-card__header-title">
          ユーザー編集
        </h2>
      </div>
    </header>
  </div>

  <div class="slds-card__body slds-card__body_inner">
    <form data-role="form">
      <div class="slds-form-element slds-m-bottom_medium">
        <label class="slds-form-element__label" for="edit-user-name">
          <abbr class="slds-required" title="必須">*</abbr>氏名
        </label>
        <div class="slds-form-element__control">
          <input id="edit-user-name" class="slds-input" type="text" value="山田 太郎" required="" data-field="name">
        </div>
      </div>

      <div class="slds-form-element slds-m-bottom_medium">
        <label class="slds-form-element__label" for="edit-user-email">
          <abbr class="slds-required" title="必須">*</abbr>メールアドレス
        </label>
        <div class="slds-form-element__control">
          <input id="edit-user-email" class="slds-input" type="email" value="taro.yamada@example.com" required="" data-field="email">
        </div>
      </div>

      <div class="slds-form-element">
        <label class="slds-form-element__label" for="edit-user-status">ステータス
        </label>
        <div class="slds-form-element__control">
          <div class="slds-select_container">
            <select id="edit-user-status" class="slds-select" data-field="status">
              <option value="active" selected="">有効</option>
              <option value="inactive">無効</option>
            </select>
          </div>
        </div>
      </div>

      <div class="slds-m-top_large app-user-edit-form__actions">
        <button class="slds-button slds-button_brand" type="submit">
          保存
        </button>
        <a class="slds-button slds-button_neutral" href="./user-list.html">
          キャンセル
        </a>
      </div>

      <p class="slds-m-top_small slds-text-body_small" data-role="status" aria-live="polite"></p>
    </form>
  </div>
</section>

      </div>
    </main>

    <footer class="slds-p-around_medium app-footer">
    <p class="slds-text-body_small">サンプル SLDS UI</p>
</footer>

    <script type="module" src="./scripts/main.js"></script>
    <script type="module" src="./components/user-edit-form/user-edit-form.js"></script>
  </body>
</html>
