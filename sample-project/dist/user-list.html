<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ユーザー一覧 | サンプル SLDS UI</title>
    <link rel="stylesheet" href="./vendor/slds/salesforce-lightning-design-system.min.css">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/layout.css">
    <link rel="stylesheet" href="./components/header/header.css">
    <link rel="stylesheet" href="./components/search-form/search-form.css">
    <link rel="stylesheet" href="./components/result-table/result-table.css">
    <link rel="stylesheet" href="./components/pagination/pagination.css">
    <link rel="stylesheet" href="./components/footer/footer.css">
  </head>
  <body>
    <header class="slds-grid slds-grid_align-spread slds-p-around_medium app-header">
    <div class="slds-grid slds-grid_vertical-align-center slds-gutters_small">
        <div class="slds-col">
            <strong class="app-header__brand">サンプル SLDS UI</strong>
        </div>
    </div>

    <nav aria-label="メインナビゲーション">
        <ul class="slds-list_horizontal slds-has-dividers_right-space">
            <li class="slds-item"><a href="./user-list.html">ユーザー一覧</a></li>
            <li class="slds-item"><a href="./user-edit.html">新規登録</a></li>
        </ul>
    </nav>
</header>

    <main class="app-main">
      <div class="app-visually-constrained app-page-stack">
        <nav aria-label="パンくず">
          <ol class="slds-breadcrumb slds-list_horizontal slds-wrap">
            <li class="slds-breadcrumb__item">
              <a href="./user-list.html">ホーム</a>
            </li>
            <li class="slds-breadcrumb__item" aria-current="page">
              <span>ユーザー一覧</span>
            </li>
          </ol>
        </nav>

        <h1 class="slds-text-heading_large app-page-heading">ユーザー一覧</h1>
        <section class="slds-card app-search-form" data-component="search-form" aria-labelledby="search-form-title">
  <div class="slds-card__header slds-grid">
    <header class="slds-media slds-media_center slds-has-flexi-truncate">
      <div class="slds-media__body">
        <h2 id="search-form-title" class="slds-card__header-title">検索結果</h2>
      </div>
    </header>
  </div>

  <div class="slds-card__body slds-card__body_inner">
    <form data-role="form">
      <div class="slds-grid slds-wrap slds-gutters">
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
          <div class="slds-form-element">
            <label class="slds-form-element__label" for="search-user-name">氏名</label>
            <div class="slds-form-element__control">
              <input id="search-user-name" class="slds-input" type="text" data-field="name" autocomplete="off">
            </div>
          </div>
        </div>

        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
          <div class="slds-form-element">
            <label class="slds-form-element__label" for="search-user-status">ステータス</label>
            <div class="slds-form-element__control">
              <div class="slds-select_container">
                <select id="search-user-status" class="slds-select" data-field="status">
                  <option value="">すべて</option>
                  <option value="active">有効</option>
                  <option value="inactive">無効</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="slds-m-top_medium app-search-form__actions">
        <button class="slds-button slds-button_brand" type="submit" data-action="search">
          検索
        </button>
        <button class="slds-button slds-button_neutral" type="reset" data-action="reset">
          クリア
        </button>
      </div>

      <p class="slds-m-top_small slds-text-body_small" data-role="status" aria-live="polite"></p>
    </form>
  </div>
</section>

        <section class="slds-card app-result-table" aria-labelledby="result-table-title">
  <div class="slds-card__header slds-grid">
    <header class="slds-media slds-media_center slds-has-flexi-truncate">
      <div class="slds-media__body">
        <h2 id="result-table-title" class="slds-card__header-title">
          検索結果
        </h2>
      </div>
    </header>
  </div>

  <div class="slds-card__body slds-card__body_inner app-result-table__scroll-area">
    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
      <caption class="slds-assistive-text">
        ユーザー検索結果
      </caption>
      <thead>
        <tr class="slds-line-height_reset">
          <th scope="col">氏名</th>
          <th scope="col">メールアドレス</th>
          <th scope="col">ステータス</th>
          <th scope="col"><span class="slds-assistive-text">操作</span></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row"><a href="./user-detail.html">山田 太郎</a></th>
          <td>taro.yamada@example.com</td>
          <td><span class="slds-badge">有効</span></td>
          <td>
            <a class="slds-button slds-button_neutral" href="./user-edit.html">編集</a>
          </td>
        </tr>
        <tr>
          <th scope="row"><a href="./user-detail.html">鈴木 花子</a></th>
          <td>hanako.suzuki@example.com</td>
          <td><span class="slds-badge">無効</span></td>
          <td>
            <a class="slds-button slds-button_neutral" href="./user-edit.html">編集</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>

        <nav class="slds-grid slds-grid_align-center app-pagination" aria-label="検索結果ページ" data-component="pagination">
  <button class="slds-button slds-button_neutral" type="button" data-action="previous" disabled="">
    前へ
  </button>
  <span class="slds-p-horizontal_medium" data-role="page-status" aria-live="polite">1 / 3ページ</span>
  <button class="slds-button slds-button_neutral" type="button" data-action="next">
    次へ
  </button>
</nav>

      </div>
    </main>

    <footer class="slds-p-around_medium app-footer">
    <p class="slds-text-body_small">サンプル SLDS UI</p>
</footer>

    <script type="module" src="./scripts/main.js"></script>
    <script type="module" src="./components/search-form/search-form.js"></script>
    <script type="module" src="./components/pagination/pagination.js"></script>
  </body>
</html>
