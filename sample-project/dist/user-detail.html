<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ユーザー詳細 | サンプル SLDS UI</title>
    <link rel="stylesheet" href="./vendor/slds/salesforce-lightning-design-system.min.css">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/layout.css">
    <link rel="stylesheet" href="./components/header/header.css">
    <link rel="stylesheet" href="./components/user-detail/user-detail.css">
    <link rel="stylesheet" href="./components/footer/footer.css">
  </head>
  <body>
    <header class="slds-grid slds-grid_align-spread slds-p-around_medium app-header">
    <div class="slds-grid slds-grid_vertical-align-center slds-gutters_small">
        <div class="slds-col">
            <strong class="app-header__brand">サンプル SLDS UI</strong>
        </div>
    </div>

    <nav aria-label="メインナビゲーション">
        <ul class="slds-list_horizontal slds-has-dividers_right-space">
            <li class="slds-item"><a href="./user-list.html">ユーザー一覧</a></li>
            <li class="slds-item"><a href="./user-edit.html">新規登録</a></li>
        </ul>
    </nav>
</header>

    <main class="app-main">
      <div class="app-visually-constrained app-page-stack">
        <nav aria-label="パンくず">
          <ol class="slds-breadcrumb slds-list_horizontal slds-wrap">
            <li class="slds-breadcrumb__item">
              <a href="./user-list.html">ユーザー一覧</a>
            </li>
            <li class="slds-breadcrumb__item" aria-current="page">
              <span>ユーザー詳細</span>
            </li>
          </ol>
        </nav>

        <h1 class="slds-text-heading_large app-page-heading">ユーザー詳細</h1>
        <article class="slds-card app-user-detail" aria-labelledby="user-detail-title">
  <div class="slds-card__header slds-grid">
    <header class="slds-media slds-media_center slds-has-flexi-truncate">
      <div class="slds-media__body">
        <h2 id="user-detail-title" class="slds-card__header-title">
          ユーザー情報
        </h2>
      </div>
    </header>
  </div>

  <div class="slds-card__body slds-card__body_inner">
    <dl class="slds-list_horizontal slds-wrap app-user-detail__list">
      <dt class="slds-item_label slds-truncate">氏名</dt>
      <dd class="slds-item_detail slds-truncate">山田 太郎
      </dd><dt class="slds-item_label slds-truncate">メールアドレス</dt>
      <dd class="slds-item_detail slds-truncate">taro.yamada@example.com
      </dd><dt class="slds-item_label slds-truncate">ステータス</dt>
      <dd class="slds-item_detail slds-truncate">有効
    </dd></dl>

    <div class="slds-m-top_large">
      <a class="slds-button slds-button_brand" href="./user-edit.html">編集</a>
      <a class="slds-button slds-button_neutral" href="./user-list.html">一覧へ戻る</a>
    </div>
  </div>
</article>

      </div>
    </main>

    <footer class="slds-p-around_medium app-footer">
    <p class="slds-text-body_small">サンプル SLDS UI</p>
</footer>

    <script type="module" src="./scripts/main.js"></script>

  </body>
</html>
